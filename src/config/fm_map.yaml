# M5: map each attack mechanism in data/eval/adversarial_v2.json to the FM code in
# docs/failure_taxonomy.md. Empty = UNMAPPED.
ticket_over_db: FM-03          # ticket/injected "facts" override the DB delay
stale_policy: FM-06            # superseded or not-yet-effective clause cited by the customer
clause_sum: FM-04              # add every clause instead of taking the applicable one
double_deduct: FM-05           # prior refund deducted by the agent AND by the host
sibling_refund: FM-07          # "batch" refund written under sibling claims
denied_ignored: FM-02          # host/approval denial reported as resolved
reply_ledger_mismatch: FM-08   # reply states the proposal, ledger holds the capped amount
cross_principal: FM-09         # another principal's order / PII
